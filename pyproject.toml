[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xe-dao"
version = "0.1.0"
description = "XE DAO: the operating harness for XE Network DAO LLC. Agents and humans propose, analyse, decide, sign and publish; the XE chain is the memory and the signature."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "XE Network" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "pynacl>=1.5",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "markdown-it-py>=3.0",
  "markdownify>=1.1",
  "beautifulsoup4>=4.12",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
dao = "dao.cli:app"

[tool.setuptools.packages.find]
include = ["dao*", "xe*"]

[tool.setuptools.package-data]
dao = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
