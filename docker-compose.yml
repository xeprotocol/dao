services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dao}
      POSTGRES_USER: ${POSTGRES_USER:-dao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dao} -d ${POSTGRES_DB:-dao}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dao}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dao}
      DAO_ROLE: api
      # the reverse proxy reaches the container from the Docker bridge; only those addresses may set X-Forwarded-For
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    volumes:
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
      - blobs:/app/blobs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8000}:8000"

  worker:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dao}
      DAO_ROLE: worker
    volumes:
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
      - blobs:/app/blobs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "dao.worker"]

volumes:
  pgdata:
  blobs:
